name: iOS build

# Compila la app en un Mac de GitHub (útil cuando no se tiene uno a mano).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project PumaStations.xcodeproj \
            -target PumaStations \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200
